name: CI / Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux-c-and-sanitizers:
    name: Linux GCC + ASan / UBSan / LSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      - name: Build and Functional Unit Tests
        run: make clean && make CC=gcc check

      - name: Address & Undefined Behavior Sanitizer
        run: make clean && make CC=gcc check-sanitize

      - name: Verify Pkg-Config & Static Library Install
        run: |
          make install PREFIX=$PWD/stage
          test -f stage/include/awp/awp.h
          test -f stage/lib/libawp.a
          test -f stage/lib/pkgconfig/awp.pc
          pkg-config --with-path=$PWD/stage/lib/pkgconfig --exists awp

  macos-c-and-rust-ffi:
    name: macOS Clang + Rust FFI (awp-rs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Run C Test Suite
        run: make clean && make check

      - name: Run Rust FFI Unit Tests (awp-rs)
        run: make check-rust

      - name: Run Rust FFI Benchmark (1M Messages)
        run: make bench-rust

  linux-rust-ffi:
    name: Linux Rust FFI (awp-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build C Library
        run: make lib

      - name: Run Rust FFI Tests (awp-rs)
        run: make check-rust
